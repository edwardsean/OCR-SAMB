# The servers the system needs (Postgres, RabbitMQ, MinIO), for a machine that doesn't have them yet.
#
#   docker compose -f docker-compose.servers.yml up -d      then ./scripts/setup.sh, then docker compose up -d --build
#
# Skip this file where the main branch's stack already runs these servers (they are the same three, on the same
# Docker network). Settings come from .env (.env.example lists them); data lives in Docker volumes and survives
# restarts.
name: samb-ocr-servers

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}          # v1's database, read-only for the pipeline; scripts/setup.sh makes its own
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq                     # fixed: RabbitMQ keeps its data per host name, so a new container keeps it
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["${RABBITMQ_HOST_PORT:-5672}:5672", "${RABBITMQ_CONSOLE_PORT:-15672}:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["${MINIO_HOST_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata: {}
  rabbitdata: {}
  miniodata: {}

networks:
  default:
    name: ${DOCKER_NETWORK:-samb-ocr_default}   # docker-compose.yml joins this network
