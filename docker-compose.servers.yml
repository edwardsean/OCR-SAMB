# The servers the system needs (Postgres, RabbitMQ, MinIO), for a machine that doesn't have them yet.
#
#   docker compose -f docker-compose.servers.yml up -d      then ./scripts/setup.sh, then docker compose up -d --build
#
# Skip this file where the main branch's stack already runs these servers (they are the same three, on the same
# Docker network). Settings come from .env (.env.example lists them); data lives in Docker volumes and survives
# restarts.
# The project is named samb-ocr, as on the mentor's server (its volumes are samb-ocr_pgdata …; another name would
# start empty servers beside them). On Edward's laptop the old samb-ocr containers already run: don't use this file
# there, it would take them over and may recreate RabbitMQ (its vhosts would be lost).
name: samb-ocr

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}          # v1's database, read-only for the pipeline; scripts/setup.sh makes its own
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq                     # fixed: RabbitMQ keeps its data per host name, so a new container keeps it
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["${RABBITMQ_HOST_PORT:-5672}:5672", "${RABBITMQ_CONSOLE_PORT:-15672}:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      # a plain TCP connect to the AMQP port: rabbitmq-diagnostics starts a whole Erlang VM each time, and every 10 s
      # on a busy 4-core server (2026-10-17) its runs took ~15-25% of the CPU the pages needed
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/5672' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  minio:
    # local adaptation: quay.io is blocked from this box (401 anonymous token) and Docker Hub removed
    # minio/minio; using the bitnami mirror with its env/command conventions, retagged to the
    # expected image name is NOT needed because compose uses this image directly.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MIO_ROOT_USER: ${MINIO_ROOT_USER}
      MIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MIO_MODE: standalone
      MIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-scans}
      MIO_CONSOLE_PORT_NUMBER: "9001"
    ports: ["${MINIO_HOST_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata: {}
  rabbitdata: {}
  miniodata: {}

networks:
  default:
    name: ${DOCKER_NETWORK:-samb-ocr_default}   # docker-compose.yml joins this network
