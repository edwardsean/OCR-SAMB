# read-then-map (git branch read-then-map, worktree .claude/worktrees/read-then-map): the mentor's two-step reading
# (transcribe everything, then map) and the knowledge learned from people, tried on b-c80bbbde4d only.
#
# It runs beside main without touching main's data: main's Postgres / RabbitMQ / MinIO SERVERS (network
# samb-ocr_default; start main first), but its own database ocr_rtm (a copy of ocr_vf), vhost rtm and storage prefix
# rtm/ (it only reads main's page renders under vf/pages/). Service names are rtm-*, never vf-*: those are main's.
# No n8n here: nothing is uploaded, and the knowledge lint runs by hand.
name: samb-ocr-rtm

x-py: &py
  build: { context: ./services }
  env_file: .env                  # a link to main's .env: keys live in one place
  volumes: [./services:/app]
  environment: &pyenv
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ocr_rtm
    MAIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?options=-c%20default_transaction_read_only%3Don
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/rtm
    MINIO_ENDPOINT: minio:9000
    STORAGE_PREFIX: rtm/
    SERVICE_PREFIX: rtm
    PIPELINE: vlm-first
    VF_AI_OCR: ${VF_AI_OCR:-groq:qwen/qwen3.8-27b}     # the AI OCR (vision): transcribes
    VF_AI_MAP: ${VF_AI_MAP:-}                           # the text model that maps a transcript (empty = the AI OCR)
    VF_READER: two_step                                 # adopted here: transcribe everything, then map (twice, merged)
  restart: unless-stopped

services:
  rtm-worker:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m worker.main
    deploy: { replicas: 3 }
    environment:
      <<: *pyenv
      OMP_THREAD_LIMIT: "1"

  rtm-grouper:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m grouper.serve

  rtm-teacher:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m worker.lesson serve

  rtm-ui:
    <<: *py
    image: samb-ocr-ui:latest
    command: uvicorn ui.app:app --host 0.0.0.0 --port 8000
    ports: ["8002:8000"]
    volumes: [./services:/app, ./tests:/app/tests:ro, ./testdata:/app/testdata:ro, ./n8n:/app/n8n:ro,
              "../../../7000356304 - 7000356499.pdf:/data/sample.pdf:ro"]
    environment:
      <<: *pyenv
      UI_URL: http://localhost:8000

networks:
  default:
    name: samb-ocr_default
    external: true
