# SAMB OCR, the vlm-first pipeline (main since 2026-09-29; v1's own services are retired, its modules are reused:
# image preparation, Tesseract, QR, Jev). One project, `samb-ocr`, so the volumes below are the same ones v1 used:
# Postgres holds both databases (ocr_vf, and v1's ocr, read-only here), MinIO keeps v1's page renders (pages/) and
# vf's files (vf/), RabbitMQ the vhost vf, n8n its workflows.
#
#   n8n       vf-intake (upload → split → q.pages), vf-sweep (3 h), vf-notify (5 min): scripts/n8n-setup-vf.sh
#   q.pages   → vf-worker ×3 (a page the daily limit stopped waits in q.pages.wait, then comes back)
#   q.group   → vf-grouper (group, check bundles, send pages back to look again)
#   q.lessons → vf-teacher (a label teaches Jev)
#   vf-ui     http://localhost:8001
#
# Service names keep their vf- prefix: n8n's workflows call http://vf-ui:8000.
name: samb-ocr

x-py: &py
  build: { context: ./services }
  env_file: .env
  volumes: [./services:/app]      # dev: code changes apply on restart, no rebuild
  environment: &pyenv
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ocr_vf
    MAIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?options=-c%20default_transaction_read_only%3Don
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/vf
    MINIO_ENDPOINT: minio:9000
    STORAGE_PREFIX: vf/
    PIPELINE: vlm-first
    VF_AI_OCR: ${VF_AI_OCR:-groq:qwen/qwen3.8-27b}     # the AI OCR: gemini, or provider:model (common/models/openai_vlm.py)
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    minio:    { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:                        # init scripts run on a fresh volume only; later migrations are applied by hand
      - pgdata:/var/lib/postgresql/data
      - ./schema/satellite-documents.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/002-page-images.sql:/docker-entrypoint-initdb.d/02-page-images.sql:ro
      - ./schema/003-page-quality.sql:/docker-entrypoint-initdb.d/03-page-quality.sql:ro
      - ./schema/004-batch-run.sql:/docker-entrypoint-initdb.d/04-batch-run.sql:ro
      - ./schema/005-page-type.sql:/docker-entrypoint-initdb.d/05-page-type.sql:ro
      - ./schema/006-type-label.sql:/docker-entrypoint-initdb.d/06-type-label.sql:ro
      - ./schema/007-extraction.sql:/docker-entrypoint-initdb.d/07-extraction.sql:ro
      - ./schema/008-document-fields.sql:/docker-entrypoint-initdb.d/08-document-fields.sql:ro
      - ./schema/009-verify.sql:/docker-entrypoint-initdb.d/09-verify.sql:ro
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Jakarta
    ports: ["5678:5678"]
    volumes: [n8ndata:/home/node/.n8n, ./n8n:/workflows:ro]
    restart: unless-stopped

  vf-worker:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m worker.main  # q.pages; a page the daily limit stopped waits in q.pages.wait, then comes back
    deploy: { replicas: 3 }         # 3 pages at a time. The AI's daily cap is reserved per call in one transaction
    environment:                    # (vf.reserve), so workers can't overspend it. ~360 MB each (Satellite's SOs)
      <<: *pyenv
      OMP_THREAD_LIMIT: "1"

  vf-grouper:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m grouper.serve   # q.group: group the batch, check its bundles, send pages back to look again
    deploy: { replicas: 1 }         # batches are serialised by their own lock; one consumer takes wake-ups together

  vf-teacher:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m worker.lesson serve   # q.lessons: a label made a lesson, or a context was approved/rejected
    deploy: { replicas: 1 }         # one lesson at a time: each proposal is built on the active context

  vf-ui:
    <<: *py
    image: samb-ocr-ui:latest
    command: uvicorn ui.app:app --host 0.0.0.0 --port 8000
    ports: ["8001:8000"]
    volumes: [./services:/app, ./tests:/app/tests:ro, ./testdata:/app/testdata:ro, ./n8n:/app/n8n:ro,
              "./7000356304 - 7000356499.pdf:/data/sample.pdf:ro"]
    environment:
      <<: *pyenv
      UI_URL: http://localhost:8000   # tests inside this container grade this UI

volumes:
  pgdata: {}
  rabbitdata: {}
  miniodata: {}
  n8ndata: {}
  ollamadata: {}                    # v1's local models; kept, no service uses it now
