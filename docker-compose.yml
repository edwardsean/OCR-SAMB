# vlm-first experiment (git branch vlm-first). Shares v1's postgres / rabbitmq / minio SERVERS on network
# samb-ocr_default, never its data: database ocr_vf, RabbitMQ vhost vf, MinIO keys under vf/ (v1's page renders are
# only read). Start v1 first. Stop vf before `docker compose down` in v1: the network can't go while vf is attached.
#
# Service names must not be ui / worker: n8n calls http://ui:8000, and a second "ui" on this network would receive
# half of v1's uploads.
name: samb-ocr-vf

x-py: &py
  env_file: .env                 # symlink to v1's .env: keys live in one place
  volumes: [./services:/app]
  environment: &pyenv
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ocr_vf
    MAIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?options=-c%20default_transaction_read_only%3Don
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/vf
    MINIO_ENDPOINT: minio:9000
    STORAGE_PREFIX: vf/
    PIPELINE: vlm-first
    VF_AI_OCR: ${VF_AI_OCR:-groq:qwen/qwen3.8-27b}     # the AI OCR: gemini, or provider:model (common/models/openai_vlm.py)
  restart: unless-stopped

services:
  vf-worker:
    <<: *py
    image: samb-ocr-worker:latest   # built by v1; same requirements
    command: python -m worker.main  # q.pages; a page the daily limit stopped waits in q.pages.wait, then comes back
    deploy: { replicas: 3 }         # 3 pages at a time. The AI's daily cap is reserved per call in one transaction
    environment:                    # (vf.reserve), so workers can't overspend it. ~360 MB each (Satellite's SOs)
      <<: *pyenv
      OMP_THREAD_LIMIT: "1"

  vf-grouper:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m grouper.serve   # q.group: group the batch, check its bundles, send pages back to look again
    deploy: { replicas: 1 }         # batches are serialised by their own lock; one consumer takes wake-ups together

  vf-teacher:
    <<: *py
    image: samb-ocr-worker:latest
    command: python -m worker.lesson serve   # q.lessons: a label made a lesson, or a context was approved/rejected
    deploy: { replicas: 1 }         # one lesson at a time: each proposal is built on the active context

  vf-ui:
    <<: *py
    image: samb-ocr-ui:latest
    command: uvicorn ui.app:app --host 0.0.0.0 --port 8000
    ports: ["8001:8000"]
    volumes: [./services:/app, ./tests:/app/tests:ro, ./testdata:/app/testdata:ro, ./n8n:/app/n8n:ro,
              "../../../7000356304 - 7000356499.pdf:/data/sample.pdf:ro"]
    environment:
      <<: *pyenv
      UI_URL: http://localhost:8000   # tests inside this container grade this UI, not v1's

networks:
  default:
    name: samb-ocr_default
    external: true
