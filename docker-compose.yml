# read-then-map (git branch read-then-map, worktree .claude/worktrees/read-then-map): the mentor's two-step reading
# (transcribe everything, then map) and the knowledge learned from people, tried on b-c80bbbde4d only.
#
# It runs beside main without touching main's data: main's Postgres / RabbitMQ / MinIO SERVERS (on main's Docker
# network: start main first), but its own database, vhost and storage prefix. Service names are rtm-*, never vf-*:
# those are main's.
#
# Every setting that depends on the machine or the stack comes from .env (copy .env.example); the defaults below are
# this worktree's. Services: rtm-api (the API, :8002), rtm-web (the web app people use, :3002), and the work behind
# them, all on RabbitMQ (no n8n since 2026-10-02): rtm-intake (uploads → pages), rtm-worker (pages), rtm-grouper
# (orders), rtm-teacher (lessons), rtm-scheduler (the periodic jobs).
name: samb-ocr-rtm

x-py: &py
  build: { context: ./services }
  env_file: .env
  volumes: [./services:/app]
  environment: &pyenv
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${PIPELINE_DB:-ocr_rtm}
    MAIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?options=-c%20default_transaction_read_only%3Don
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-rtm}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    STORAGE_PREFIX: ${STORAGE_PREFIX:-rtm/}
    SERVICE_PREFIX: ${SERVICE_PREFIX:-rtm}
    PIPELINE: ${PIPELINE:-vlm-first}
    VF_READER: ${VF_READER:-two_step}                   # adopted here: transcribe everything, then map (twice, merged)
  restart: unless-stopped

services:
  # Each uploaded scan (q.intake): split into pages, one ticket per page on q.pages.
  rtm-intake:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-worker:latest
    command: python -m intake.serve
    deploy: { replicas: "${INTAKE_REPLICAS:-1}" }

  rtm-worker:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-worker:latest
    command: python -m worker.main
    deploy: { replicas: "${WORKER_REPLICAS:-3}" }
    environment:
      <<: *pyenv
      OMP_THREAD_LIMIT: "1"

  rtm-grouper:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-worker:latest
    command: python -m grouper.serve

  rtm-teacher:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-worker:latest
    command: python -m worker.lesson serve

  # The periodic jobs (intake retry, needs-you notice, sweep, knowledge lint). Each runs once per interval however
  # many schedulers run (staging.job_run), so one is enough.
  rtm-scheduler:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-worker:latest
    command: python -m scheduler.serve

  # The API (services/api): the REST API the web app calls (/api/v1, documented in docs/api.md and at /docs), page
  # images and PDFs, and the developers' Teknis screens. An upload is put on q.intake for rtm-intake.
  rtm-api:
    <<: *py
    image: ${IMAGE_PREFIX:-samb-ocr}-api:latest
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports: ["${API_PORT:-8002}:8000"]
    volumes: [./services:/app, ./tests:/app/tests:ro, ./testdata:/app/testdata:ro, ./.env.example:/app/.env.example:ro,
              "${SAMPLE_DIR:-./testdata}:/data:ro"]           # the sample scan, if you have it: <dir>/sample.pdf
    environment:
      <<: *pyenv
      WEB_URL: ${WEB_URL:-http://localhost:3002}        # where a browser opening the API's own address is sent
      API_URL: http://localhost:8000                    # the tests, run inside this container, call the API here

  # The web app (frontend/, Next.js): the screens people work in, over rtm-api's REST API. One address for
  # everything: what it has no page for (the Teknis screens, images, PDFs) it passes on to rtm-api.
  rtm-web:
    build: { context: ./frontend, args: { API_URL: http://rtm-api:8000 } }
    image: ${IMAGE_PREFIX:-samb-ocr}-web:latest
    environment:
      API_URL: http://rtm-api:8000
    ports: ["${WEB_PORT:-3002}:3000"]
    depends_on: [rtm-api]
    restart: unless-stopped

networks:
  default:
    name: ${DOCKER_NETWORK:-samb-ocr_default}          # main's network, where its servers run
    external: true
