<table class="grid">
  <thead><tr><th>Batch</th><th>File</th><th>Pages</th><th>Rendered</th><th>Read</th><th>Status</th><th>Received</th></tr></thead>
  <tbody>
  {% for b in batches %}
    <tr>
      <td><a class="mono" href="/batches/{{ b.id }}">{{ b.id }}</a></td>
      <td class="mono">{{ b.file_name }}</td>
      <td>{{ b.page_total }}</td>
      <td>{{ b.pages_rendered }}</td>
      <td>{{ b.page_done }}</td>
      <td><span class="pill s-{{ b.status }}">{{ b.status }}</span></td>
      <td class="muted">{{ b.received_at.strftime('%d %b %H:%M') }}</td>
    </tr>
  {% else %}
    <tr><td colspan="7" class="muted">No batches yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
